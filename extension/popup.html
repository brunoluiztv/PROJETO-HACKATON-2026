<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acessibilidade AgroSponge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Acessibilidade</h1>

    <section aria-labelledby="h-texto">
      <h2 id="h-texto">Tamanho do texto: <span id="valor-escala">100%</span></h2>
      <div class="linha">
        <button type="button" id="menor" aria-label="Diminuir texto">A−</button>
        <button type="button" id="normal" aria-label="Tamanho normal">A</button>
        <button type="button" id="maior" aria-label="Aumentar texto">A+</button>
      </div>
    </section>

    <section aria-labelledby="h-ver">
      <h2 id="h-ver">Ver melhor</h2>
      <button type="button" class="chave" data-pref="contraste" aria-pressed="false">Alto contraste</button>
      <button type="button" class="chave" data-pref="escuro" aria-pressed="false">Modo escuro</button>
      <button type="button" class="chave" data-pref="foco" aria-pressed="false">Destacar onde estou</button>
    </section>

    <section aria-labelledby="h-ler">
      <h2 id="h-ler">Ler melhor</h2>
      <button type="button" class="chave" data-pref="dislexia" aria-pressed="false">Letras para dislexia</button>
      <button type="button" class="chave" data-pref="espacamento" aria-pressed="false">Mais espaço no texto</button>
      <button type="button" class="chave" data-pref="semMovimento" aria-pressed="false">Sem animações</button>
    </section>

    <section aria-labelledby="h-voz">
      <h2 id="h-voz">Ouvir</h2>
      <div class="linha">
        <button type="button" id="ouvir" class="primario">🔊 Ler em voz alta</button>
        <button type="button" id="parar">⏹ Parar</button>
      </div>
      <p class="dica">Lê o texto selecionado ou a tela que está aberta.</p>
      <p id="status" role="status" aria-live="polite" class="dica"></p>
    </section>

    <button type="button" id="restaurar" class="sec">Voltar ao normal</button>
    <p class="dica">Atalho para abrir: <kbd>Alt</kbd> + <kbd>A</kbd>. Funciona só no site AgroSponge RS.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
